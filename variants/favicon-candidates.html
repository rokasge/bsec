<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>favicon — cube, white plate</title><meta name="robots" content="noindex">
<style>
 body{background:#f2f2f3;color:#1b1b1d;font-family:"Segoe UI",system-ui,Arial,sans-serif;padding:40px;max-width:760px;margin:auto}
 h1{font-size:19px;margin-bottom:6px} p.lead{color:#5a6169;font-size:13.5px;margin-bottom:22px}
 .sizes{display:flex;align-items:flex-end;gap:18px;background:#fff;border:1px solid #dcdce0;padding:20px;border-radius:4px}
 .sizes span{display:inline-block;background-repeat:no-repeat;background-size:contain;background-position:center}
 .f16{width:16px;height:16px} .f32{width:32px;height:32px} .f64{width:64px;height:64px} .f128{width:128px;height:128px}
 .tabbar{margin-top:22px;background:#fff;border:1px solid #dcdce0;border-radius:6px 6px 0 0;padding:9px 12px;display:flex;gap:6px}
 .tabbar.dark{background:#2b2b2e;border-color:#3a3a3e;border-radius:0 0 6px 6px;margin-top:0}
 .tab{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#3a3f45;padding:5px 11px;border-radius:4px 4px 0 0;background:#f2f2f3}
 .tab.on{background:#fff;box-shadow:0 -1px 3px rgba(0,0,0,.08)}
 .tab.dark-on{background:#3a3a3e;color:#e8e8e8}
 .tab i{width:16px;height:16px;display:inline-block;background-size:contain;background-repeat:no-repeat;
        background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><rect x='18' y='18' width='64' height='64' fill='none' stroke='%231a5fd0' stroke-width='9'/></svg>")}
 .bar{margin-top:22px;padding:13px 17px;background:#fff;border:1px solid #dcdce0;border-left:3px solid #1a5fd0;font-size:13px;color:#5a6169}
</style></head><body>

  <span class="f32" style="background-image:url(&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><rect x='18' y='18' width='64' height='64' fill='none' stroke='%231a5fd0' stroke-width='9'/></svg>&quot;)"></span>
  <span class="f64" style="background-image:url(&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><rect x='18' y='18' width='64' height='64' fill='none' stroke='%231a5fd0' stroke-width='9'/></svg>&quot;)"></span>
  <span class="f128" style="background-image:url(&quot;data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ffffff'/><rect x='18' y='18' width='64' height='64' fill='none' stroke='%231a5fd0' stroke-width='9'/></svg>&quot;)"></span>
</div>
<div class="tabbar">
  <span class="tab on"><i data-i></i>baltsec</span>
  <span class="tab"><i data-i></i>baltsec &mdash; second</span>
</div>
<div class="tabbar dark">
  <span class="tab dark-on"><i data-i></i>baltsec</span>
  <span class="tab dark-on"><i data-i></i>baltsec &mdash; second</span>
</div>
<div class="bar">Light tab bar above, dark tab bar below &mdash; checking the white plate still reads on both.</div>
</body></html>
